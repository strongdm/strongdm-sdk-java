plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id "io.github.gradle-nexus.publish-plugin" version "1.1.0"
    id 'signing'
}

def grpcVersion = '1.82.2'
def jsonVersion = '20250517'
def nettyVersion = '4.1.136.Final'
def protobufVersion = '3.25.8'
def releaseVersion = System.getenv('JAVA_SDK_VERSION')

sourceCompatibility = '1.8'
targetCompatibility = '1.8'
version = releaseVersion

archivesBaseName = "strongdm-sdk"
group = 'io.github.strongdm'

// for more info on sourceset annotations:
// https://docs.gradle.org/current/userguide/building_java_projects.html#sec:compile
sourceSets {
    main {
        java {
            srcDirs = ['com']
        }
    }
}

repositories {
    maven { // The google mirror is less flaky than mavenCentral()
        url "https://maven-central.storage-download.googleapis.com/repos/central/data/" }
    mavenCentral()
    mavenLocal()
}

// for more info on dependency annotations:
// https://docs.gradle.org/current/userguide/building_java_projects.html#sec:java_dependency_management_overview
dependencies {
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "io.grpc:grpc-netty:${grpcVersion}"

    // grpc-netty's transitive Netty carries known CVEs; the BOM keeps every
    // Netty module aligned on a patched version
    implementation platform("io.netty:netty-bom:${nettyVersion}")
    // Explicit versions for the modules security scanners flag: Snyk's gradle
    // parser cannot resolve the BOM constraint and otherwise reports
    // grpc-netty's older transitive versions. runtimeOnly: the SDK never
    // imports io.netty directly (Netty reaches the compile classpath only
    // transitively via grpc-netty).
    runtimeOnly "io.netty:netty-codec:${nettyVersion}"
    runtimeOnly "io.netty:netty-codec-http:${nettyVersion}"
    runtimeOnly "io.netty:netty-codec-http2:${nettyVersion}"
    runtimeOnly "io.netty:netty-handler:${nettyVersion}"

    // grpc-protobuf's transitive protobuf-java (< 3.25.5) carries known CVEs
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"

    implementation "org.json:json:${jsonVersion}"
    compileOnly "javax.annotation:javax.annotation-api:1.2"
}

java {
    withJavadocJar()
    withSourcesJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'strongdm-sdk-java'
            from components.java
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
            pom {
                name = 'strongdm-sdk-java'
                description = 'strongDM SDK'
                url = 'https://github.com/strongdm/strongdm-sdk-java'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'strongdm'
                        name = 'strongDM Engineering'
                        email = 'support@strongdm.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com:strongdm/strongdm-sdk-java.git'
                    developerConnection = 'scm:git:ssh://github.com:strongdm/strongdm-sdk-java.git'
                    url = 'https://github.com/strongdm/strongdm-sdk-java'
                }
            }
        }
    }
    repositories {
        maven {
            url = "https://github.com/strongdm/strongdm-sdk-java"
        }
    }
}

signing {
    sign publishing.publications.mavenJava
}

javadoc {
    if(JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
    exclude '/strongdm/api/plumbing/**'
}

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
            username = System.getenv("OSSRH_USERNAME")
            password = System.getenv("OSSRH_PASSWORD")
        }
    }
}
